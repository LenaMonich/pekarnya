<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пекарня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #c0561f);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --warn: #e08a00;
    --line: rgba(128,128,128,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg2); padding: 10px 12px 6px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 18px; padding: 7px 14px; font-size: 15px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .extra { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .extra input { width: 20px; height: 20px; accent-color: var(--accent); }
  #search { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; }
  .nav { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: none; border: none; background: var(--bg); color: var(--accent); border-radius: 14px;
    padding: 5px 11px; font-size: 13px; white-space: nowrap; }
  .cat { margin: 14px 12px 4px; padding: 4px 0; font-size: 13px; text-transform: uppercase; color: var(--hint);
    letter-spacing: .03em; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .cat .arrow { display: inline-block; width: 14px; transition: transform .15s; }
  .cat.closed .arrow { transform: rotate(-90deg); }
  .cat .badge { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 600; }
  .cat .cnt { text-transform: none; letter-spacing: 0; opacity: .7; }
  .list.closed { display: none; }
  .list { background: var(--bg); margin: 0 12px; border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.sel { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .name { flex: 1; min-width: 0; }
  .name b { font-weight: 500; display: block; }
  .stock { font-size: 12px; color: var(--hint); }
  .stock.low { color: var(--warn); font-weight: 600; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 36px; height: 36px; border-radius: 10px; border: none; font-size: 20px;
    background: var(--bg2); color: var(--text); }
  .qty input { width: 56px; height: 36px; text-align: center; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; }
  .qty input.g { width: 84px; }
  .unit { font-size: 13px; color: var(--hint); width: 14px; }
  .made { display: none; margin-top: 4px; font-size: 13px; color: var(--hint); }
  .row.sel .made { display: block; }
  .made select { font-size: 13px; padding: 3px 4px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); max-width: 100%; }
  .made .per { margin-left: 6px; white-space: nowrap; }
  .made.ret { line-height: 2; }
  .made .note { display: block; width: 100%; max-width: 230px; margin-top: 4px; font-size: 13px; padding: 5px 7px;
    border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .made .per.bad { color: #d9342b; font-weight: 600; }
  #msg { margin: 30px 16px; text-align: center; color: var(--hint); }
  #summary { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); font-size: 14px; display: none; }
  #summary button { width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .pad { height: 120px; }
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <div id="rests" class="chips" style="display:none"></div>
  <label id="extraBox" class="extra" style="display:none"><input type="checkbox" id="extra"> ⚡ Доп. рейс сегодня (бланк придёт сразу)</label>
  <input id="search" type="search" placeholder="Поиск продукта">
  <div id="nav" class="nav"></div>
</header>
<div id="msg">Загрузка…</div>
<div id="content"></div>
<div class="pad"></div>
<div id="summary"><div id="sumText"></div><button id="saveBtn">Записать</button></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  // r — приготовлено (в таблице «Выпуск»), s — отгрузка, b — возврат от ресторана, w — списание
  const MODE = ['s', 'b', 'w'].indexOf(q.get('mode')) >= 0 ? q.get('mode') : 'r';
  const CHECK_STOCK = MODE === 's' || MODE === 'w';      // подсвечивать, если берём больше, чем есть на складе
  const NEEDS_REST = MODE === 's' || MODE === 'b';
  const API = q.get('api') || '';
  const KEY = q.get('k') || '';
  const CACHE = 'pek_catalog_v1';
  // Вид списка по роли: 'c' — кондитер/админ, 'b' — пекарь, иначе — порядок как в таблице, всё раскрыто.
  // order — какие разделы и в каком порядке идут первыми (остальные следом), closed — что свёрнуто по умолчанию.
  const VIEW = q.get('v') || '';
  const VIEWS_DEFAULT = {
    c: { order: ['Postre', 'Mermelada', 'Producto Semiacabado', 'Pan', 'Cruasán y Bollería'], closed: ['Pan', 'Cruasán y Bollería'] },
    b: { order: ['Pan', 'Cruasán y Bollería', 'Producto Semiacabado', 'Mermelada', 'Postre'], closed: ['Mermelada', 'Postre'] },
  };
  const COLLAPSE_KEY = 'pek_collapsed_v2_' + MODE + '_' + VIEW;
  let collapsed = null;        // {категория: true} — что свёрнуто; запоминается на этом телефоне
  try { const c = localStorage.getItem(COLLAPSE_KEY); if (c) collapsed = JSON.parse(c); } catch (e) {}
  const badges = {};           // категория -> элемент со счётчиком выбранного

  let catalog = null;          // {products:[{code,name,cat,unit}], restaurants:[], stock:{}}
  const qty = {};              // code -> число
  const made = {};             // code -> сколько дней назад сделан (0 — сегодня); только для отгрузки
  const dest = {};             // code -> 1: на склад (иначе утилизация); только для возврата
  const reason = {};           // code -> номер причины; для возврата и списания
  const note = {};             // code -> комментарий к списанию (необязательно)
  const REASONS_DEFAULT = ['Брак', 'Ошибка в заказе', 'Другое'];
  const WRITEOFF_DEFAULT = ['Брак', 'Недопёк / пережарен', 'Просрочка', 'Порча при хранении или перевозке', 'Ошибка / пересорт', 'Проработка', 'Персонал', 'Другое'];
  const offReasons = () => (catalog && catalog.writeoffReasons) || WRITEOFF_DEFAULT;
  const retReasons = () => (catalog && catalog.returnReasons) || REASONS_DEFAULT;
  // Причины для продукта: списание и возврат в утилизацию — причины списания; возврат на склад — причины возврата
  const reasonsFor = code => (MODE === 'w' || (MODE === 'b' && !dest[code])) ? offReasons() : retReasons();
  const reasonText = code => { const l = reasonsFor(code); return l[reason[code] || 0] || l[0]; };
  const MAX_AGO = 10;
  const pad = n => ('0' + n).slice(-2);
  const dayText = ago => { const d = new Date(Date.now() - ago * 86400000); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
  let rest = null;

  const $ = id => document.getElementById(id);
  $('title').textContent = MODE === 's' ? '🚚 Отгрузка' : MODE === 'b' ? '↩️ Возврат от ресторана'
    : MODE === 'w' ? '🗑 Списание' : '🍞 Приготовлено';

  if (tg) { tg.ready(); tg.expand(); }
  // Если открыли не из бота — сохранять нечем, но страницу показываем
  const canSend = !!(tg && tg.sendData && tg.platform && tg.platform !== 'unknown');

  // 1) показываем сохранённый справочник сразу (мгновенно), 2) обновляем с сервера
  try { const c = localStorage.getItem(CACHE); if (c) { catalog = JSON.parse(c); render(); } } catch (e) {}
  if (API) {
    fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'a=catalog&k=' + encodeURIComponent(KEY), { redirect: 'follow' })
      .then(r => r.json())
      .then(d => {
        if (!d || !d.products) throw new Error(d && d.error || 'нет данных');
        catalog = d;
        try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {}
        render();
      })
      .catch(err => { if (!catalog) $('msg').textContent = 'Не удалось загрузить список продуктов: ' + err.message; });
  } else if (!catalog) {
    $('msg').textContent = 'Откройте эту страницу кнопкой в боте.';
  }

  function render() {
    if (!catalog) return;
    $('msg').style.display = 'none';
    if (NEEDS_REST) renderRestaurants();
    renderList();
    updateSummary();
  }

  function renderRestaurants() {
    const box = $('rests');
    box.style.display = 'flex';
    if (MODE === 's') $('extraBox').style.display = 'flex';
    box.innerHTML = '';
    if (rest === null && catalog.restaurants.length === 1) rest = 0;
    catalog.restaurants.forEach((r, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (rest === i ? ' on' : '');
      b.textContent = r;
      b.onclick = () => { rest = i; haptic(); renderRestaurants(); updateSummary(); };
      box.appendChild(b);
    });
  }

  // Настройки вида: из бота (catalog.views), иначе встроенные
  function view() { return ((catalog && catalog.views) || VIEWS_DEFAULT)[VIEW] || null; }

  // Категории в порядке для роли; разделы, которых нет в настройке вида, идут после перечисленных
  function orderedCats() {
    const cats = [];
    catalog.products.forEach(p => { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    const v = view();
    if (!v) return cats;
    const first = v.order.filter(c => cats.indexOf(c) >= 0);
    return first.concat(cats.filter(c => first.indexOf(c) < 0));
  }

  function saveCollapsed() { try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch (e) {} }

  function renderList() {
    const filter = $('search').value.trim().toLowerCase();
    const root = $('content');
    root.innerHTML = '';
    const nav = $('nav');
    nav.innerHTML = '';
    if (collapsed === null) {                 // первый запуск: по умолчанию для роли
      collapsed = {};
      const v = view();
      if (v) v.closed.forEach(c => { collapsed[c] = true; });
    }
    orderedCats().forEach(cat => {
      const prods = catalog.products.filter(p => p.cat === cat && (!filter || p.name.toLowerCase().indexOf(filter) >= 0));
      if (!prods.length) return;
      const isClosed = !filter && !!collapsed[cat];   // при поиске всё раскрыто

      const h = document.createElement('div');
      h.className = 'cat' + (isClosed ? ' closed' : '');
      h.innerHTML = '<span class="arrow">▾</span><span class="ttl"></span><span class="cnt"></span><span class="badge"></span>';
      h.querySelector('.ttl').textContent = cat;
      h.querySelector('.cnt').textContent = '· ' + prods.length;
      badges[cat] = h.querySelector('.badge');
      root.appendChild(h);

      const list = document.createElement('div');
      list.className = 'list' + (isClosed ? ' closed' : '');
      prods.forEach(p => list.appendChild(row(p)));
      root.appendChild(list);

      const setClosed = v => {
        if (v) collapsed[cat] = true; else delete collapsed[cat];
        h.classList.toggle('closed', v);
        list.classList.toggle('closed', v);
        saveCollapsed();
      };
      h.onclick = () => { if (filter) return; haptic(); setClosed(!collapsed[cat]); };

      const nb = document.createElement('button');
      nb.textContent = cat;
      nb.onclick = () => {
        if (!filter && collapsed[cat]) setClosed(false);     // переход к разделу раскрывает его
        const top = h.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 4;
        window.scrollTo({ top: top, behavior: 'smooth' });
      };
      nav.appendChild(nb);
    });
    if (!root.children.length) root.innerHTML = '<div id="msg2" style="text-align:center;color:var(--hint);margin:30px">Ничего не найдено</div>';
    updateBadges();
  }

  // У свёрнутого раздела видно, сколько в нём выбрано
  function updateBadges() {
    if (!catalog) return;
    const n = {};
    catalog.products.forEach(p => { if (qty[p.code]) n[p.cat] = (n[p.cat] || 0) + 1; });
    Object.keys(badges).forEach(c => { badges[c].textContent = n[c] ? 'выбрано: ' + n[c] : ''; });
  }

  function row(p) {
    const grams = p.unit === 'г';
    const d = document.createElement('div');
    d.className = 'row' + (qty[p.code] ? ' sel' : '');
    const st = Number(catalog.stock[p.code] || 0);
    const low = CHECK_STOCK && qty[p.code] > st;
    d.innerHTML = '<div class="name"><b></b><span class="stock' + (low ? ' low' : '') + '"></span>' +
      (MODE === 's' ? '<div class="made">📅 сделан: <select></select><span class="per"></span></div>' : '') +
      (MODE === 'b' ? '<div class="made ret">куда: <select class="dst"><option value="0">утилизация</option><option value="1">на склад</option></select>' +
        '<br>причина: <select class="rsn"></select>' +
        '<input class="note" type="text" maxlength="80" placeholder="комментарий (необязательно)"></div>' : '') +
      (MODE === 'w' ? '<div class="made ret">причина: <select class="rsn"></select>' +
        '<input class="note" type="text" maxlength="80" placeholder="комментарий (необязательно)"></div>' : '') + '</div>' +
      '<div class="qty">' + (grams ? '' : '<button class="m">−</button>') +
      '<input inputmode="numeric" pattern="[0-9]*" class="' + (grams ? 'g' : '') + '" placeholder="' + (grams ? 'грамм' : '0') + '">' +
      (grams ? '<span class="unit">г</span>' : '<button class="p">+</button>') + '</div>';
    d.querySelector('b').textContent = p.name;
    d.querySelector('.stock').textContent = 'на складе: ' + st + ' ' + p.unit + (low ? ' — не хватает' : '');
    // Возврат: куда идёт (утилизация по умолчанию) и причина
    const dst = d.querySelector('.dst'), rsn = d.querySelector('.rsn');
    const fillReasons = () => {
      rsn.innerHTML = '';
      reasonsFor(p.code).forEach((t, i) => { const o = document.createElement('option'); o.value = i; o.textContent = t; rsn.appendChild(o); });
      rsn.value = reason[p.code] || 0;
    };
    if (rsn) {
      fillReasons();
      rsn.onchange = () => { const i = Number(rsn.value) || 0; if (i) reason[p.code] = i; else delete reason[p.code]; };
    }
    const noteInp = d.querySelector('.note');
    if (noteInp) {
      noteInp.value = note[p.code] || '';
      noteInp.addEventListener('input', () => { const t = noteInp.value.trim(); if (t) note[p.code] = t; else delete note[p.code]; });
    }
    if (dst) {
      dst.value = dest[p.code] ? 1 : 0;
      dst.onchange = () => {
        if (dst.value === '1') dest[p.code] = 1; else delete dest[p.code];
        delete reason[p.code];          // список причин зависит от «куда» — начинаем с первой
        fillReasons();
      };
    }
    const inp = d.querySelector('.qty input');
    inp.value = qty[p.code] || '';
    // Дата изготовления: по умолчанию сегодня (день отгрузки), можно выбрать более раннюю
    const sel = MODE === 's' ? d.querySelector('.made select') : null;
    if (sel) {
      for (let a = 0; a <= MAX_AGO; a++) {
        const o = document.createElement('option');
        o.value = a;
        o.textContent = (a === 0 ? 'сегодня, ' : a === 1 ? 'вчера, ' : '') + dayText(a);
        sel.appendChild(o);
      }
      sel.value = made[p.code] || 0;
      const per = d.querySelector('.per');
      const showPeriod = () => {
        const ago = Number(sel.value) || 0;
        if (p.days === null || p.days === undefined) { per.textContent = ''; return; }
        per.textContent = 'срок ' + dayText(ago) + '–' + dayText(ago - p.days);
        per.classList.toggle('bad', p.days - ago < 0);      // срок уже истёк
        if (p.days - ago < 0) per.textContent += ' — истёк!';
      };
      sel.onchange = () => { const a = Number(sel.value) || 0; if (a) made[p.code] = a; else delete made[p.code]; showPeriod(); };
      showPeriod();
    }
    const set = v => {
      v = Math.max(0, Math.min(100000, parseInt(v, 10) || 0));
      if (v) qty[p.code] = v; else delete qty[p.code];
      inp.value = v || '';
      d.classList.toggle('sel', !!v);
      const lowNow = CHECK_STOCK && v > st;
      const s = d.querySelector('.stock');
      s.classList.toggle('low', lowNow);
      s.textContent = 'на складе: ' + st + ' ' + p.unit + (lowNow ? ' — не хватает' : '');
      updateSummary();
    };
    inp.addEventListener('input', () => set(inp.value.replace(/\D/g, '')));
    const m = d.querySelector('.m'), pl = d.querySelector('.p');
    if (m) m.onclick = () => { haptic(); set((qty[p.code] || 0) - 1); };
    if (pl) pl.onclick = () => { haptic(); set((qty[p.code] || 0) + 1); };
    return d;
  }

  $('search').addEventListener('input', renderList);

  // приготовлено: [код, кол-во]; отгрузка: [код, кол-во, дней назад сделан];
  // возврат: [код, кол-во, 1 — на склад / 0 — утилизация, № причины]; списание: [код, кол-во, № причины]
  function items() {
    return Object.keys(qty).map(c => {
      // причина уходит текстом — ровно то, что видел сотрудник; последним необязательный комментарий
      if (MODE === 'b') return note[c] ? [c, qty[c], dest[c] ? 1 : 0, reasonText(c), note[c]] : [c, qty[c], dest[c] ? 1 : 0, reasonText(c)];
      if (MODE === 'w') return note[c] ? [c, qty[c], reasonText(c), note[c]] : [c, qty[c], reasonText(c)];
      return MODE === 's' && made[c] ? [c, qty[c], made[c]] : [c, qty[c]];
    });
  }

  function updateSummary() {
    updateBadges();
    const it = items();
    const box = $('summary');
    if (!it.length) { box.style.display = 'none'; if (tg) tg.MainButton.hide(); return; }
    const byCode = {};
    catalog.products.forEach(p => { byCode[p.code] = p; });
    const n = it.length;
    let txt = 'Выбрано позиций: ' + n;
    if (NEEDS_REST) txt += rest === null ? ' · выберите ресторан ↑' : ' · ' + catalog.restaurants[rest];
    $('sumText').textContent = txt;
    box.style.display = 'block';
  }

  function haptic() { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  $('saveBtn').onclick = () => {
    const it = items();
    if (!it.length) return;
    if (NEEDS_REST && rest === null) { alertMsg('Выберите ресторан вверху.'); return; }
    const byCode = {};
    catalog.products.forEach(p => { byCode[p.code] = p; });
    const lines = it.map(([c, v, a, r, n]) => (byCode[c] ? byCode[c].name : c) + ' — ' + v + ' ' + (byCode[c] ? byCode[c].unit : '') +
      (MODE === 'b' ? ' (' + (a ? 'на склад' : 'утилизация') + ', ' + String(r).toLowerCase() + (n ? ': ' + n : '') + ')'
       : MODE === 'w' ? ' (' + String(a).toLowerCase() + (r ? ': ' + r : '') + ')'
       : (a ? ' (сделан ' + dayText(a) + ')' : '')));
    const head = MODE === 's'
      ? 'Отгрузка → ' + catalog.restaurants[rest] + ($('extra').checked ? ' (доп. рейс)' : '')
      : MODE === 'b' ? 'Возврат ← ' + catalog.restaurants[rest]
      : MODE === 'w' ? 'Списание'
      : 'Приготовлено';
    const text = head + ':\n' + lines.join('\n');
    const go = () => {
      const payload = { m: MODE, i: it };
      if (NEEDS_REST) payload.r = catalog.restaurants[rest];
      if (MODE === 's') payload.x = $('extra').checked ? 1 : 0;
      const s = JSON.stringify(payload);
      if (!canSend) { alertMsg('Откройте страницу кнопкой в боте — тогда можно сохранять.'); return; }
      if (s.length > 4000) { alertMsg('Слишком много позиций за раз — разделите на две записи.'); return; }
      tg.sendData(s);   // бот получит список и запишет в таблицу; окно закроется
    };
    // окно подтверждения Telegram вмещает ~250 символов — для длинного списка показываем кратко
    const short = text.length < 230 ? text : head + ': ' + it.length + ' поз.';
    if (canSend && tg.showConfirm) tg.showConfirm(short + '\n\nЗаписать?', ok => { if (ok) go(); });
    else if (confirm(text + '\n\nЗаписать?')) go();
  };

  function alertMsg(t) { if (tg && tg.showAlert) tg.showAlert(t); else alert(t); }
})();
</script>

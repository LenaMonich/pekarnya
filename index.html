<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пекарня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #c0561f);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --warn: #e08a00;
    --line: rgba(128,128,128,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg2); padding: 10px 12px 6px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 18px; padding: 7px 14px; font-size: 15px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chip.b2b { border-style: dashed; }
  .chips .lbl { align-self: center; font-size: 12px; color: var(--hint); margin-left: 4px; }
  .chips select { font-size: 15px; padding: 7px 10px; border-radius: 18px; border: 1px solid var(--accent);
    background: var(--bg); color: var(--text); max-width: 100%; }
  .extra { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .extra input { width: 20px; height: 20px; accent-color: var(--accent); }
  .extra select { font-size: 14px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  #search { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; }
  .nav { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: none; border: none; background: var(--bg); color: var(--accent); border-radius: 14px;
    padding: 5px 11px; font-size: 13px; white-space: nowrap; }
  .cat { margin: 14px 12px 4px; padding: 4px 0; font-size: 13px; text-transform: uppercase; color: var(--hint);
    letter-spacing: .03em; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .cat .arrow { display: inline-block; width: 14px; transition: transform .15s; }
  .cat.closed .arrow { transform: rotate(-90deg); }
  .cat .badge { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 600; }
  .cat .cnt { text-transform: none; letter-spacing: 0; opacity: .7; }
  .list.closed { display: none; }
  .list { background: var(--bg); margin: 0 12px; border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.sel { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .name { flex: 1; min-width: 0; }
  .name b { font-weight: 500; display: block; }
  .stock { font-size: 12px; color: var(--hint); }
  .stock.low { color: var(--warn); font-weight: 600; }
  .pf { display: block; font-size: 12px; color: var(--hint); }
  .pf.low { color: var(--warn); font-weight: 600; }
  /* хлеб со свежим и заморозкой: две строки, у каждой свои − [ ] + */
  .row.fzrow { display: block; }
  .fzrow .fzname b { font-weight: 500; }
  .fzrow .fzname .per { display: block; font-size: 12px; color: var(--hint); }
  .fzline { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .fzline .lbl { flex: 1; font-size: 13px; color: var(--hint); }
  .fzline .lbl.low { color: var(--warn); font-weight: 600; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 36px; height: 36px; border-radius: 10px; border: none; font-size: 20px;
    background: var(--bg2); color: var(--text); }
  .qty input { width: 56px; height: 36px; text-align: center; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; }
  .qty input.g { width: 84px; }
  .qty input.hq { width: 48px; }
  .qty button.h { width: 32px; font-size: 16px; color: var(--accent); }
  .unit { font-size: 13px; color: var(--hint); width: 14px; }
  .made { display: none; margin-top: 4px; font-size: 13px; color: var(--hint); }
  .row.sel .made { display: block; }
  .made select { font-size: 13px; padding: 3px 4px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); max-width: 100%; }
  .made .per { margin-left: 6px; white-space: nowrap; }
  .made.ret { line-height: 2; }
  .made .note { display: block; width: 100%; max-width: 230px; margin-top: 4px; font-size: 13px; padding: 5px 7px;
    border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .made .per.bad { color: #d9342b; font-weight: 600; }
  #msg { margin: 30px 16px; text-align: center; color: var(--hint); }
  #summary { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); font-size: 14px; display: none; }
  #summary button { width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .pad { height: 120px; }
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <div id="rests" class="chips" style="display:none"></div>
  <label id="extraBox" class="extra" style="display:none"><input type="checkbox" id="extra"> <span id="extraTxt">⚡ Доп. рейс сегодня (бланк придёт сразу)</span></label>
  <label id="dtBox" class="extra" style="display:none">📅 <span id="dtTxt">Дата записи:</span> <select id="dt"></select></label>
  <label id="openBox" class="extra" style="display:none"><input type="checkbox" id="opening"> <span id="openTxt">📦 Инвентаризация: вписываю, сколько есть на самом деле (можно 0)</span></label>
  <input id="search" type="search" placeholder="Поиск продукта">
  <div id="nav" class="nav"></div>
</header>
<div id="msg">Загрузка…</div>
<div id="content"></div>
<div class="pad"></div>
<div id="summary"><div id="sumText"></div><button id="saveBtn">Записать</button></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  // r — приготовлено (в таблице «Выпуск»), s — отгрузка, b — возврат от ресторана, w — списание
  const MODE = ['s', 'b', 'w'].indexOf(q.get('mode')) >= 0 ? q.get('mode') : 'r';
  // Язык: l=es — испанский (переключается кнопкой «🌐» в боте), иначе русский
  const ES = q.get('l') === 'es';
  const L = (ru, es) => (ES ? es : ru);
  // Причины хранятся в таблице по-русски; на экране — перевод (из бота, иначе встроенный)
  const REASON_ES_DEFAULT = { 'Брак': 'Mala elaboración', 'Недопёк / пережарен': 'Mal horneado', 'Просрочка': 'Caducado',
    'Порча при хранении или перевозке': 'Mal estado', 'Ошибка / пересорт': 'Error', 'Проработка': 'Prueba de receta',
    'Персонал': 'Staff', 'Другое': 'Otro', 'Ошибка в заказе': 'Error en el pedido' };
  const rLabel = t => (ES ? (((catalog && catalog.reasonsEs) || REASON_ES_DEFAULT)[t] || t) : t);
  const uLabel = u => (ES ? (u === 'г' ? 'g' : u === 'шт' ? 'ud' : u) : u);
  const CHECK_STOCK = MODE === 's' || MODE === 'w';      // подсвечивать, если берём больше, чем есть на складе
  const NEEDS_REST = MODE === 's' || MODE === 'b';
  const API = q.get('api') || '';
  const KEY = q.get('k') || '';
  const CACHE = 'pek_catalog_v1';
  // Вид списка по роли: 'c' — кондитер/админ, 'b' — пекарь, иначе — порядок как в таблице, всё раскрыто.
  // order — какие разделы и в каком порядке идут первыми (остальные следом), closed — что свёрнуто по умолчанию.
  const VIEW = q.get('v') || '';
  const VIEWS_DEFAULT = {
    c: { order: ['Postre', 'Mermelada', 'Producto Semiacabado', 'Pan', 'Cruasán y Bollería'], closed: ['Pan', 'Cruasán y Bollería'] },
    b: { order: ['Pan', 'Cruasán y Bollería', 'Producto Semiacabado', 'Mermelada', 'Postre'], closed: ['Mermelada', 'Postre'] },
  };
  const COLLAPSE_KEY = 'pek_collapsed_v2_' + MODE + '_' + VIEW;
  let collapsed = null;        // {категория: true} — что свёрнуто; запоминается на этом телефоне
  try { const c = localStorage.getItem(COLLAPSE_KEY); if (c) collapsed = JSON.parse(c); } catch (e) {}
  const badges = {};
  const pfHints = [];          // обновление подсказок «из ПФ …» (только «Приготовлено»)           // категория -> элемент со счётчиком выбранного

  let catalog = null;          // {products:[{code,name,cat,unit}], restaurants:[], stock:{}}
  const qty = {};              // code -> число
  const made = {};             // code -> сколько дней назад сделан (0 — сегодня); только для отгрузки
  const dest = {};             // code -> 1: на склад (иначе утилизация); только для возврата
  const reason = {};           // code -> номер причины; для возврата и списания
  const note = {};
  const fzq = {};              // code свежего -> сколько взять из заморозки (только отгрузка)             // code -> комментарий к списанию (необязательно)
  const REASONS_DEFAULT = ['Брак', 'Ошибка в заказе', 'Другое'];
  const WRITEOFF_DEFAULT = ['Брак', 'Недопёк / пережарен', 'Просрочка', 'Порча при хранении или перевозке', 'Ошибка / пересорт', 'Проработка', 'Персонал', 'Другое'];
  const offReasons = () => (catalog && catalog.writeoffReasons) || WRITEOFF_DEFAULT;
  const retReasons = () => (catalog && catalog.returnReasons) || REASONS_DEFAULT;
  // Причины для продукта: списание и возврат в утилизацию — причины списания; возврат на склад — причины возврата
  const reasonsFor = code => (MODE === 'w' || (MODE === 'b' && !dest[code])) ? offReasons() : retReasons();
  const reasonText = code => { const l = reasonsFor(code); return l[reason[code] || 0] || l[0]; };
  const MAX_AGO = 10;
  const pad = n => ('0' + n).slice(-2);
  const fmt = n => String(Math.round(Number(n) * 100) / 100).replace('.', ',');     // 0.5 → «0,5»
  const dayText = ago => { const d = new Date(Date.now() - ago * 86400000); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
  let rest = null;
  let b2bOpen = false;         // выбран чип «B2B» (клиент — из списка)

  const $ = id => document.getElementById(id);
  $('title').textContent = MODE === 's' ? L('🚚 Отгрузка', '🚚 Envío') : MODE === 'b' ? L('↩️ Возврат от ресторана', '↩️ Devolución del restaurante')
    : MODE === 'w' ? L('🗑 Списание', '🗑 Desechar') : L('🍞 Приготовлено', '🍞 Elaborado');
  if (ES) {
    document.documentElement.lang = 'es';
    document.title = 'Obrador';
    $('extraTxt').textContent = '⚡ Viaje extra hoy (el albarán llega al momento)';
    $('openTxt').textContent = '📦 Inventario: escribo cuánto hay de verdad (se puede 0)';
    $('dtTxt').textContent = 'Fecha del registro:';
    $('search').placeholder = 'Buscar producto';
    $('msg').textContent = 'Cargando…';
    $('saveBtn').textContent = 'Guardar';
  }

  if (tg) { tg.ready(); tg.expand(); }
  // Если открыли не из бота — сохранять нечем, но страницу показываем
  const canSend = !!(tg && tg.sendData && tg.platform && tg.platform !== 'unknown');

  // 1) показываем сохранённый справочник сразу (мгновенно), 2) обновляем с сервера
  try { const c = localStorage.getItem(CACHE); if (c) { catalog = prep(JSON.parse(c)); render(); } } catch (e) {}
  if (API) {
    fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'a=catalog&k=' + encodeURIComponent(KEY), { redirect: 'follow' })
      .then(r => r.json())
      .then(d => {
        if (!d || !d.products) throw new Error(d && d.error || L('нет данных', 'sin datos'));
        try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {}
        catalog = prep(d);
        render();
      })
      .catch(err => { if (!catalog) $('msg').textContent = L('Не удалось загрузить список продуктов: ', 'No se pudo cargar la lista de productos: ') + err.message; });
  } else if (!catalog) {
    $('msg').textContent = L('Откройте эту страницу кнопкой в боте.', 'Abre esta página con el botón del bot.');
  }

  // ПФ (сырые полуфабрикаты) не отгружают и не возвращают — в этих списках их нет
  function prep(d) {
    d.all = d.products.slice();          // полный справочник (для цепочек ПФ), до фильтров
    if ((MODE === 's' || MODE === 'b') && d.pfCat) d.products = d.products.filter(p => p.cat !== d.pfCat);
    // полки заморозки (Lino ❄️): в списке их нет (кроме списания), но в отгрузке у свежего хлеба
    // есть строка «❄️ из заморозки» — сколько взять с полки для этого получателя
    d.shelves = d.products.filter(p => p.fz);
    if (MODE !== 'w') d.products = d.products.filter(p => !p.fz);
    // «Приготовлено» и «Отгрузка»: кондитер и пекари видят только своё (админ — всё)
    const role = VIEW === 'b' ? 'b1' : VIEW;
    if (MODE === 'r' && ['c', 'b1', 'b2'].indexOf(role) >= 0) d.products = d.products.filter(p => !p.mk || p.mk.indexOf(role) >= 0);
    // круассаны «ПФ при отгрузке» в «Приготовлено» не записывают (кроме админа — для инвентаризации)
    if (MODE === 'r' && role !== 'a') d.products = d.products.filter(p => !p.pfShip);
    // «Отгрузка»: пекарь 1 отгружает и готовое пекаря 2 (из бота: shipFor)
    if (MODE === 's' && ['c', 'b1', 'b2'].indexOf(role) >= 0) {
      const can = (d.shipFor && d.shipFor[role]) || [role];
      d.products = d.products.filter(p => !p.mk || p.mk.some(x => can.indexOf(x) >= 0));
    }
    return d;
  }

  // «Приготовлено»: у готового из ПФ видно, сколько ПФ на складе; все изделия из одного ПФ считаются вместе
  // Сколько можно взять изделия с учётом цепочки «ПФ при отгрузке»: Clasico + PF Clásico
  function availOf(code, depth) {
    const p = (catalog.all || catalog.products).filter(x => x.code === code)[0];
    let s = Math.max(0, Number(catalog.stock[code] || 0));
    if (p && p.pfShip && p.from && (depth || 0) < 5) s += availOf(p.from, (depth || 0) + 1);
    return s;
  }
  // Настоящий источник по цепочке: Pistacho ← Cruasán Clasico ← PF Cruasán Clásico
  function rootOf(code) {
    let p = (catalog.all || catalog.products).filter(x => x.code === code)[0], g = 0;
    while (p && p.pfShip && p.from && g++ < 5) p = (catalog.all || catalog.products).filter(x => x.code === p.from)[0] || p;
    return p;
  }

  function pfUsed(src) {
    let n = 0;
    catalog.products.forEach(x => { if (x.from === src && qty[x.code]) n += qty[x.code]; });
    return n;
  }
  function updatePfHints() { pfHints.forEach(f => f()); }

  function render() {
    if (!catalog) return;
    $('msg').style.display = 'none';
    // админ в «Приготовлено» может внести начальный остаток (например, ПФ, которые уже лежат на складе)
    if (MODE === 'r' && VIEW === 'a') $('openBox').style.display = 'flex';
    // админ может записать задним числом (забыли вчера): до 14 дней назад
    if (VIEW === 'a' && !$('dt').options.length) {
      for (let a = 0; a <= 14; a++) {
        const o = document.createElement('option');
        o.value = a;
        o.textContent = (a === 0 ? L('сегодня, ', 'hoy, ') : a === 1 ? L('вчера, ', 'ayer, ') : '') + dayText(a);
        $('dt').appendChild(o);
      }
      $('dtBox').style.display = 'flex';
    }
    if (NEEDS_REST) renderRestaurants();
    renderList();
    updateSummary();
  }

  function renderRestaurants() {
    const box = $('rests');
    box.style.display = 'flex';
    const b2b = catalog.b2b || [];
    const isB2B = i => i !== null && b2b.indexOf(catalog.restaurants[i]) >= 0;
    // доп. рейс — только для наших ресторанов (у B2B нет бланка)
    $('extraBox').style.display = MODE === 's' && !isB2B(rest) ? 'flex' : 'none';
    if (isB2B(rest)) $('extra').checked = false;
    box.innerHTML = '';
    if (rest === null && catalog.restaurants.length === 1) rest = 0;
    const pick = i => { rest = i; haptic(); renderRestaurants(); dropNotFor(); renderList(); updateSummary(); };
    // наши рестораны — чипами
    catalog.restaurants.forEach((r, i) => {
      if (isB2B(i)) return;
      const b = document.createElement('button');
      b.className = 'chip' + (rest === i ? ' on' : '');
      b.textContent = r;
      b.onclick = () => { b2bOpen = false; pick(i); };
      box.appendChild(b);
    });
    // B2B — один чип, а клиент выбирается из списка (для аналитики по клиентам)
    if (b2b.length) {
      const on = b2bOpen || isB2B(rest);
      const b = document.createElement('button');
      b.className = 'chip b2b' + (on ? ' on' : '');
      b.textContent = 'B2B';
      b.onclick = () => { b2bOpen = true; if (!isB2B(rest)) rest = null; haptic(); renderRestaurants(); dropNotFor(); renderList(); updateSummary(); };
      box.appendChild(b);
      if (on) {
        const sel = document.createElement('select');
        const o0 = document.createElement('option'); o0.value = ''; o0.textContent = L('— клиент —', '— cliente —'); sel.appendChild(o0);
        catalog.restaurants.forEach((r, i) => {
          if (!isB2B(i)) return;
          const o = document.createElement('option'); o.value = i; o.textContent = r; sel.appendChild(o);
        });
        sel.value = isB2B(rest) ? String(rest) : '';
        sel.onchange = () => { pick(sel.value === '' ? null : Number(sel.value)); };
        box.appendChild(sel);
      }
    }
  }

  // Настройки вида: из бота (catalog.views), иначе встроенные
  function view() { return ((catalog && catalog.views) || VIEWS_DEFAULT)[VIEW] || null; }

  // Категории в порядке для роли; разделы, которых нет в настройке вида, идут после перечисленных
  function orderedCats() {
    const cats = [];
    catalog.products.forEach(p => { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    const v = view();
    if (!v) return cats;
    const first = v.order.filter(c => cats.indexOf(c) >= 0);
    return first.concat(cats.filter(c => first.indexOf(c) < 0));
  }

  function saveCollapsed() { try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch (e) {} }

  function renderList() {
    const filter = $('search').value.trim().toLowerCase();
    const root = $('content');
    root.innerHTML = '';
    pfHints.length = 0;
    const nav = $('nav');
    nav.innerHTML = '';
    if (collapsed === null) {                 // первый запуск: по умолчанию для роли
      collapsed = {};
      const v = view();
      if (v) v.closed.forEach(c => { collapsed[c] = true; });
    }
    orderedCats().forEach(cat => {
      const prods = catalog.products.filter(p => p.cat === cat && fitsRest(p) && (!filter || p.name.toLowerCase().indexOf(filter) >= 0));
      if (!prods.length) return;
      const isClosed = !filter && !!collapsed[cat];   // при поиске всё раскрыто

      const h = document.createElement('div');
      h.className = 'cat' + (isClosed ? ' closed' : '');
      h.innerHTML = '<span class="arrow">▾</span><span class="ttl"></span><span class="cnt"></span><span class="badge"></span>';
      h.querySelector('.ttl').textContent = cat;
      h.querySelector('.cnt').textContent = '· ' + prods.length;
      badges[cat] = h.querySelector('.badge');
      root.appendChild(h);

      const list = document.createElement('div');
      list.className = 'list' + (isClosed ? ' closed' : '');
      prods.forEach(p => list.appendChild(row(p)));
      root.appendChild(list);

      const setClosed = v => {
        if (v) collapsed[cat] = true; else delete collapsed[cat];
        h.classList.toggle('closed', v);
        list.classList.toggle('closed', v);
        saveCollapsed();
      };
      h.onclick = () => { if (filter) return; haptic(); setClosed(!collapsed[cat]); };

      const nb = document.createElement('button');
      nb.textContent = cat;
      nb.onclick = () => {
        if (!filter && collapsed[cat]) setClosed(false);     // переход к разделу раскрывает его
        const top = h.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 4;
        window.scrollTo({ top: top, behavior: 'smooth' });
      };
      nav.appendChild(nb);
    });
    if (!root.children.length) root.innerHTML = '<div id="msg2" style="text-align:center;color:var(--hint);margin:30px">' + L('Ничего не найдено', 'No se encontró nada') + '</div>';
    updateBadges();
  }

  // У свёрнутого раздела видно, сколько в нём выбрано
  function updateBadges() {
    if (!catalog) return;
    const n = {};
    catalog.products.forEach(p => { if (qty[p.code] || fzq[p.code]) n[p.cat] = (n[p.cat] || 0) + 1; });
    Object.keys(badges).forEach(c => { badges[c].textContent = n[c] ? L('выбрано: ', 'elegidos: ') + n[c] : ''; });
  }

  function row(p) {
    const shelf0 = shelfFor(p.code);
    if (shelf0) return rowFz(p, shelf0);
    const grams = p.unit === 'г';
    // Торты (есть порции) можно отгружать, возвращать и списывать половинками; готовят — целыми
    const half = !!p.portions && MODE !== 'r' && !grams;
    const d = document.createElement('div');
    d.className = 'row' + (qty[p.code] ? ' sel' : '');
    // круассаны «ПФ при отгрузке»: в отгрузке доступно готовое + их ПФ
    const pfs = MODE === 's' && p.pfShip;
    const st = pfs ? availOf(p.code) : Number(catalog.stock[p.code] || 0);
    const srcP = pfs ? (catalog.all || catalog.products).filter(x => x.code === p.from)[0] : null;
    const stLbl = pfs ? ' (' + L('из ', 'de ') + (srcP ? srcP.name : 'PF') + ')' : '';
    const low = CHECK_STOCK && qty[p.code] > st;
    const src = MODE === 'r' && p.from ? (catalog.all || catalog.products).filter(x => x.code === p.from)[0] : null;
    d.innerHTML = '<div class="name"><b></b><span class="stock' + (low ? ' low' : '') + '"></span>' +
      (src ? '<span class="pf"></span>' : '') +
      (MODE === 's' ? '<div class="made">' + L('📅 сделан: ', '📅 hecho: ') + '<select></select><span class="per"></span></div>' : '') +
      (MODE === 'b' ? '<div class="made ret">' + L('куда: ', 'destino: ') + '<select class="dst"><option value="0">' + L('утилизация', 'desechar') +
        '</option><option value="1">' + L('на склад', 'al almacén') + '</option></select>' +
        '<br>' + L('причина: ', 'motivo: ') + '<select class="rsn"></select>' +
        '<input class="note" type="text" maxlength="80" placeholder="' + L('комментарий (необязательно)', 'comentario (opcional)') + '"></div>' : '') +
      (MODE === 'w' ? '<div class="made ret">' + L('причина: ', 'motivo: ') + '<select class="rsn"></select>' +
        '<input class="note" type="text" maxlength="80" placeholder="' + L('комментарий (необязательно)', 'comentario (opcional)') + '"></div>' : '') + '</div>' +
      '<div class="qty">' + (grams ? '' : '<button class="m">−</button>') +
      (half ? '<input inputmode="decimal" class="hq" placeholder="0">'
            : '<input inputmode="numeric" pattern="[0-9]*" class="' + (grams ? 'g' : '') + '" placeholder="' + (grams ? L('грамм', 'gramos') : '0') + '">') +
      (grams ? '<span class="unit">' + uLabel('г') + '</span>' : '<button class="p">+</button>') +
      (half ? '<button class="h" title="' + L('половина', 'mitad') + '">½</button>' : '') + '</div>';
    d.querySelector('b').textContent = p.name;
    d.querySelector('.stock').textContent = L('на складе: ', 'en stock: ') + fmt(st) + ' ' + uLabel(p.unit) + stLbl + (low ? L(' — не хватает', ' — no alcanza') : '');
    if (src) {
      const pfEl = d.querySelector('.pf');
      const upd = () => {
        const have = availOf(src.code), used = pfUsed(src.code);
        pfEl.textContent = L('из ', 'de ') + (rootOf(src.code) || src).name + ': ' + fmt(have) + (used ? L(' → останется ', ' → quedarán ') + fmt(have - used) : '') +
          (used > have ? L(' — не хватает ПФ', ' — falta PF') : '');
        pfEl.classList.toggle('low', used > have);
      };
      pfHints.push(upd);
      upd();
    }
    // Возврат: куда идёт (утилизация по умолчанию) и причина
    const dst = d.querySelector('.dst'), rsn = d.querySelector('.rsn');
    const fillReasons = () => {
      rsn.innerHTML = '';
      reasonsFor(p.code).forEach((t, i) => { const o = document.createElement('option'); o.value = i; o.textContent = rLabel(t); rsn.appendChild(o); });
      rsn.value = reason[p.code] || 0;
    };
    if (rsn) {
      fillReasons();
      rsn.onchange = () => { const i = Number(rsn.value) || 0; if (i) reason[p.code] = i; else delete reason[p.code]; };
    }
    const noteInp = d.querySelector('.note');
    if (noteInp) {
      noteInp.value = note[p.code] || '';
      noteInp.addEventListener('input', () => { const t = noteInp.value.trim(); if (t) note[p.code] = t; else delete note[p.code]; });
    }
    if (dst) {
      dst.value = dest[p.code] ? 1 : 0;
      dst.onchange = () => {
        if (dst.value === '1') dest[p.code] = 1; else delete dest[p.code];
        delete reason[p.code];          // список причин зависит от «куда» — начинаем с первой
        fillReasons();
      };
    }
    const inp = d.querySelector('.qty input');
    inp.value = qty[p.code] ? fmt(qty[p.code]) : '';
    // Дата изготовления: по умолчанию сегодня (день отгрузки), можно выбрать более раннюю
    const sel = MODE === 's' ? d.querySelector('.made select') : null;
    if (sel) {
      for (let a = 0; a <= MAX_AGO; a++) {
        const o = document.createElement('option');
        o.value = a;
        o.textContent = (a === 0 ? L('сегодня, ', 'hoy, ') : a === 1 ? L('вчера, ', 'ayer, ') : '') + dayText(a);
        sel.appendChild(o);
      }
      sel.value = made[p.code] || 0;
      const per = d.querySelector('.per');
      const showPeriod = () => {
        const ago = Number(sel.value) || 0;
        if (p.days === null || p.days === undefined) { per.textContent = ''; return; }
        per.textContent = L('срок ', 'caduca ') + dayText(ago) + '–' + dayText(ago - p.days);
        per.classList.toggle('bad', p.days - ago < 0);      // срок уже истёк
        if (p.days - ago < 0) per.textContent += L(' — истёк!', ' — ¡caducado!');
      };
      sel.onchange = () => { const a = Number(sel.value) || 0; if (a) made[p.code] = a; else delete made[p.code]; showPeriod(); };
      showPeriod();
    }
    // keepText — не переписывать поле, пока человек печатает («0,» ещё не число)
    const set = (v, keepText) => {
      v = half ? Math.round((parseFloat(String(v).replace(',', '.')) || 0) * 2) / 2 : (parseInt(v, 10) || 0);
      v = Math.max(0, Math.min(100000, v));
      // инвентаризация: вписанный 0 — тоже значение («на складе ничего нет»)
      const inv0 = MODE === 'r' && $('opening').checked && keepText && String(inp.value).trim() !== '';
      if (v || inv0) qty[p.code] = v; else delete qty[p.code];
      if (!keepText) inp.value = v ? fmt(v) : '';
      d.classList.toggle('sel', !!(v || fzq[p.code]));
      const lowNow = CHECK_STOCK && v > st;
      const s = d.querySelector('.stock');
      s.classList.toggle('low', lowNow);
      s.textContent = L('на складе: ', 'en stock: ') + fmt(st) + ' ' + uLabel(p.unit) + stLbl + (lowNow ? L(' — не хватает', ' — no alcanza') : '');
      if (MODE === 'r') updatePfHints();
      updateSummary();
    };
    if (half) {
      inp.addEventListener('input', () => set(inp.value.replace(/[^\d.,]/g, ''), true));
      inp.addEventListener('blur', () => set(qty[p.code] || 0));
    } else {
      // «0» оставляем в поле как есть (для инвентаризации это значит «нет на складе»)
      inp.addEventListener('input', () => set(inp.value.replace(/\D/g, ''), /^0+$/.test(inp.value.trim())));
    }
    const m = d.querySelector('.m'), pl = d.querySelector('.p'), hb = d.querySelector('.h');
    if (m) m.onclick = () => { haptic(); set((qty[p.code] || 0) - 1); };
    if (pl) pl.onclick = () => { haptic(); set((qty[p.code] || 0) + 1); };
    // «½»: добавить половину, а если она уже есть — убрать (1 → 1,5 → 1)
    if (hb) hb.onclick = () => { haptic(); const c = qty[p.code] || 0; set(Number.isInteger(c) ? c + 0.5 : c - 0.5); };
    return d;
  }

  // Отгрузка хлеба, у которого есть заморозка: две строки — свежий и из заморозки (полка получателя).
  // Записывается всё одной строкой «Pan de Lino 900gr», дата одна — день отгрузки.
  function rowFz(p, shelf) {
    const d = document.createElement('div');
    d.className = 'row fzrow';
    const st = Number(catalog.stock[p.code] || 0), have = Number(catalog.stock[shelf.code] || 0);
    const lbl = shelf.name.replace(p.name, '').replace(/❄️|congelado/gi, '').trim();
    const line = cls => '<div class="fzline ' + cls + '"><span class="lbl"></span><div class="qty"><button class="m">−</button>' +
      '<input inputmode="numeric" pattern="[0-9]*" placeholder="0"><button class="p">+</button></div></div>';
    d.innerHTML = '<div class="fzname"><b></b><span class="per"></span></div>' + line('fr') + line('fz');
    d.querySelector('b').textContent = p.name;
    delete made[p.code];                                  // дата одна — сегодня
    if (p.days !== null && p.days !== undefined) d.querySelector('.per').textContent = L('срок ', 'caduca ') + dayText(0) + '–' + dayText(-p.days);
    const bind = (cls, store, avail, text) => {
      const box = d.querySelector('.fzline.' + cls), inp = box.querySelector('input'), lb = box.querySelector('.lbl');
      const show = () => {
        const v = store[p.code] || 0;
        lb.textContent = text + ' · ' + L('есть ', 'hay ') + fmt(avail) + (v > avail ? L(' — не хватает', ' — no alcanza') : '');
        lb.classList.toggle('low', v > avail);
        d.classList.toggle('sel', !!(qty[p.code] || fzq[p.code]));
      };
      const set = (v, keep) => {
        v = Math.max(0, Math.min(100000, parseInt(v, 10) || 0));
        if (v) store[p.code] = v; else delete store[p.code];
        if (!keep) inp.value = v ? fmt(v) : '';
        show(); updateSummary();
      };
      inp.value = store[p.code] ? fmt(store[p.code]) : '';
      inp.addEventListener('input', () => set(inp.value.replace(/\D/g, ''), true));
      box.querySelector('.m').onclick = () => { haptic(); set((store[p.code] || 0) - 1); };
      box.querySelector('.p').onclick = () => { haptic(); set((store[p.code] || 0) + 1); };
      show();
    };
    bind('fr', qty, st, L('🍞 свежий', '🍞 fresco'));
    bind('fz', fzq, have, L('❄️ из заморозки (', '❄️ del congelador (') + lbl + ')');
    return d;
  }

  $('search').addEventListener('input', renderList);

  // приготовлено: [код, кол-во]; отгрузка: [код, кол-во, дней назад сделан];
  // возврат: [код, кол-во, 1 — на склад / 0 — утилизация, № причины]; списание: [код, кол-во, № причины]
  // «Кому»: продукт только для наших ресторанов ('rest') или только для B2B ('b2b')
  function fitsRest(p) {
    if (MODE !== 's' || rest === null || !p.to) return true;
    const b2b = (catalog.b2b || []).indexOf(catalog.restaurants[rest]) >= 0;
    return p.to === (b2b ? 'b2b' : 'rest');
  }
  // сменили получателя — убираем то, что ему не отправляют
  function dropNotFor() {
    catalog.products.forEach(p => { if (qty[p.code] && !fitsRest(p)) { delete qty[p.code]; delete made[p.code]; } });
    Object.keys(fzq).forEach(c => delete fzq[c]);     // полка зависит от получателя — выбираем заново
  }

  // полка заморозки для этого хлеба и текущего получателя (рестораны / B2B)
  function shelfFor(code) {
    if (MODE !== 's' || rest === null || !catalog.shelves) return null;
    const b2b = (catalog.b2b || []).indexOf(catalog.restaurants[rest]) >= 0;
    const list = catalog.shelves.filter(sh => sh.fz === code);
    return list.filter(sh => sh.to ? sh.to === (b2b ? 'b2b' : 'rest') : /b2b/i.test(sh.name) === b2b)[0] || null;
  }

  function items() {
    if (MODE === 's') {
      // [код, всего, дней назад сделан, сколько из заморозки]
      const codes = Object.keys(qty).concat(Object.keys(fzq).filter(c => !qty[c]));
      return codes.map(c => {
        const f = fzq[c] || 0, tot = (qty[c] || 0) + f;
        return f ? [c, tot, made[c] || 0, f] : made[c] ? [c, tot, made[c]] : [c, tot];
      });
    }
    return Object.keys(qty).map(c => {
      // причина уходит текстом — ровно то, что видел сотрудник; последним необязательный комментарий
      if (MODE === 'b') return note[c] ? [c, qty[c], dest[c] ? 1 : 0, reasonText(c), note[c]] : [c, qty[c], dest[c] ? 1 : 0, reasonText(c)];
      if (MODE === 'w') return note[c] ? [c, qty[c], reasonText(c), note[c]] : [c, qty[c], reasonText(c)];
      return MODE === 's' && made[c] ? [c, qty[c], made[c]] : [c, qty[c]];
    });
  }

  function updateSummary() {
    updateBadges();
    const it = items();
    const box = $('summary');
    if (!it.length) { box.style.display = 'none'; if (tg) tg.MainButton.hide(); return; }
    const byCode = {};
    catalog.products.forEach(p => { byCode[p.code] = p; });
    const n = it.length;
    let txt = L('Выбрано позиций: ', 'Productos elegidos: ') + n;
    if (NEEDS_REST) txt += rest === null ? (b2bOpen ? L(' · выберите клиента B2B ↑', ' · elige cliente B2B ↑') : L(' · выберите ресторан ↑', ' · elige restaurante ↑'))
                                         : ' · ' + ((catalog.b2b || []).indexOf(catalog.restaurants[rest]) >= 0 ? 'B2B ' : '') + catalog.restaurants[rest];
    $('sumText').textContent = txt;
    box.style.display = 'block';
  }

  function haptic() { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  $('saveBtn').onclick = () => {
    const it = items();
    if (!it.length) return;
    if (NEEDS_REST && rest === null) { alertMsg(b2bOpen ? L('Выберите клиента B2B вверху.', 'Elige el cliente B2B arriba.') : L('Выберите ресторан вверху.', 'Elige el restaurante arriba.')); return; }
    const byCode = {};
    catalog.products.forEach(p => { byCode[p.code] = p; });
    const lines = it.map(([c, v, a, r, n]) => (byCode[c] ? byCode[c].name : c) + ' — ' + fmt(v) + ' ' + (byCode[c] ? uLabel(byCode[c].unit) : '') +
      (MODE === 's' && r ? L(' (из них ❄️ ', ' (❄️ ') + fmt(r) + L(' из заморозки)', ' del congelador)') : '') +
      (MODE === 'b' ? ' (' + (a ? L('на склад', 'al almacén') : L('утилизация', 'desechar')) + ', ' + rLabel(r).toLowerCase() + (n ? ': ' + n : '') + ')'
       : MODE === 'w' ? ' (' + rLabel(a).toLowerCase() + (r ? ': ' + r : '') + ')'
       : (a ? L(' (сделан ', ' (hecho ') + dayText(a) + ')' : '')));
    // (в отгрузке 4-й элемент — из заморозки, он показан выше)
    const head = MODE === 's'
      ? L('Отгрузка → ', 'Envío → ') + catalog.restaurants[rest] + ($('extra').checked ? L(' (доп. рейс)', ' (viaje extra)') : '')
      : MODE === 'b' ? L('Возврат ← ', 'Devolución ← ') + catalog.restaurants[rest]
      : MODE === 'w' ? L('Списание', 'Desechar')
      : $('opening').checked ? L('Инвентаризация (есть на самом деле)', 'Inventario (hay de verdad)') : L('Приготовлено', 'Elaborado');
    // отгрузка и списание: предупредить, если берём больше, чем есть
    const warn = [];
    if (MODE === 's' || MODE === 'w') it.forEach(([c, v, a, f]) => {
      const pp = byCode[c] || {};
      const fresh = v - (MODE === 's' ? (f || 0) : 0),
            have = MODE === 's' && pp.pfShip ? availOf(c) : Number(catalog.stock[c] || 0);
      if (fresh > have) warn.push((byCode[c] ? byCode[c].name : c) + ': ' + L('есть ', 'hay ') + fmt(have));
      const sh = MODE === 's' && f ? shelfFor(c) : null;
      if (sh && f > Number(catalog.stock[sh.code] || 0)) warn.push('❄️ ' + sh.name + ': ' + L('есть ', 'hay ') + fmt(catalog.stock[sh.code] || 0));
    });
    const warnText = warn.length ? L('\n\n⚠️ Не хватает на складе:\n', '\n\n⚠️ No hay suficiente:\n') + warn.join('\n') : '';
    // отгрузку без остатка не записываем (сервер тоже проверит)
    if (MODE === 's' && warn.length) {
      alertMsg(L('⛔ Не хватает на складе — отгрузка не записывается:\n', '⛔ No hay suficiente — el envío no se guarda:\n') + warn.join('\n'));
      return;
    }
    const back = Number($('dt').value) || 0;
    const text = head + (back ? ' · 📅 ' + dayText(back) : '') + ':\n' + lines.join('\n') + warnText;
    const go = () => {
      const payload = { m: MODE, i: it };
      if (NEEDS_REST) payload.r = catalog.restaurants[rest];
      if (MODE === 's') payload.x = $('extra').checked ? 1 : 0;
      if (MODE === 'r' && $('opening').checked) payload.o = 2;     // инвентаризация
      if (back) payload.dt = back;                                // задним числом
      const s = JSON.stringify(payload);
      if (!canSend) { alertMsg(L('Откройте страницу кнопкой в боте — тогда можно сохранять.', 'Abre la página con el botón del bot para poder guardar.')); return; }
      if (s.length > 4000) { alertMsg(L('Слишком много позиций за раз — разделите на две записи.', 'Demasiados productos a la vez: divídelo en dos registros.')); return; }
      tg.sendData(s);   // бот получит список и запишет в таблицу; окно закроется
    };
    // окно подтверждения Telegram вмещает ~250 символов — для длинного списка показываем кратко
    const short = text.length < 230 ? text : head + ': ' + it.length + L(' поз.', ' prod.') +
      (warn.length ? L('\n⚠️ Не хватает на складе: ', '\n⚠️ No hay suficiente: ') + warn.length + L(' поз.', ' prod.') : '');
    if (canSend && tg.showConfirm) tg.showConfirm(short + L('\n\nЗаписать?', '\n\n¿Guardar?'), ok => { if (ok) go(); });
    else if (confirm(text + L('\n\nЗаписать?', '\n\n¿Guardar?'))) go();
  };

  function alertMsg(t) { if (tg && tg.showAlert) tg.showAlert(t); else alert(t); }
})();
</script>
</body>
</html>
